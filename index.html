<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MindGuard-AI</title>
  
  <!-- PWA & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" id="metaThemeColor" content="#121212">
  <meta name="description" content="AI that detects wellbeing changes before they become crises.">

  <!-- Load Three.js from CDN for the 3D Background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    /* CSS Variables for Dynamic System Dark / Light Theme & 3D Sync */
    :root {
      /* DYNAMIC UI SYNC VARIABLES (Updated via JS based on AI Mood) */
      --dynamic-color: #4e4376; 
      --dynamic-glow: rgba(78, 67, 118, 0.4);

      /* App Theme Overlays (Highly transparent for 3D visibility) */
      --bg-main: rgba(18, 18, 18, 0.25); 
      --bg-card: rgba(25, 25, 25, 0.65);
      --bg-sidebar: rgba(15, 15, 18, 0.95); /* Deep dark frosted glass */
      --border-color: rgba(255, 255, 255, 0.1);
      
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      
      --user-msg: rgba(63, 63, 70, 0.75);
      --ai-msg: rgba(20, 20, 20, 0.75);
      
      --overlay-bg: rgba(0, 0, 0, 0.7);
      --shadow: rgba(0, 0, 0, 0.5);
      --danger: #ef4444;
      --blur-bg: transparent; 
    }

    /* Light Mode Overrides - Maintains 3D Visibility but adapts text contrast */
    body.light-mode {
      --bg-main: rgba(255, 255, 255, 0.45);
      --bg-card: rgba(255, 255, 255, 0.75);
      --bg-sidebar: rgba(250, 250, 252, 0.95); /* Clean bright frosted glass */
      --border-color: rgba(0, 0, 0, 0.1);
      
      --text-main: #18181b;
      --text-sub: #52525b;
      
      --user-msg: rgba(220, 220, 225, 0.85);
      --ai-msg: rgba(255, 255, 255, 0.85);
      
      --shadow: rgba(0, 0, 0, 0.15);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* WebGL Canvas Background */
    #webgl-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1; 
      pointer-events: none; 
      background: #050505; /* Deep space base behind the 3D object */
    }

    html, body {
      overscroll-behavior-y: none;
      background-color: #050505; /* Hard-coded black instantly prevents white flash on load */
      color: var(--text-main);
      width: 100%;
      height: 100dvh;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      transition: color 0.25s;
    }

    /* Custom Webkit Scrollbars for Professional Look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
      display: none; 
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-sub);
    }
    * {
      -ms-overflow-style: none;  
      scrollbar-width: none;  
    }

    /* Sidebar - Navigation Drawer */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      width: 300px;
      background-color: var(--bg-sidebar);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.active {
      transform: translateX(0);
    }

    @media (min-width: 900px) {
      .sidebar {
        position: static;
        transform: none !important;
      }
      .sidebar-overlay {
        display: none !important;
      }
      .menu-btn {
        display: none !important;
      }
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: none; 
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
    }

    .sidebar-header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }

    .sidebar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--dynamic-color);
      letter-spacing: -0.3px;
      text-shadow: 0 0 10px var(--dynamic-glow);
      transition: color 0.5s ease, text-shadow 0.5s ease;
    }

    .new-chat-btn {
      margin: 0;
      padding: 16px;
      background: var(--dynamic-color);
      box-shadow: 0 4px 15px var(--dynamic-glow);
      color: #ffffff;
      border: none;
      border-radius: 0;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.5s ease, box-shadow 0.5s ease, transform 0.1s;
    }

    .new-chat-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0; /* Prevents icon from breaking layout on small screens */
    }

    .new-chat-btn:active {
      transform: scale(0.98);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .session-item {
      padding: 16px;
      margin: 0;
      border-radius: 0;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background 0.2s, border-left 0.2s;
    }

    .session-item:hover {
      background-color: var(--bg-card);
    }

    .session-item.active {
      font-weight: 600;
      border-left: 4px solid var(--dynamic-color);
      background-color: var(--dynamic-glow); /* Smooth ambient glow for active session */
      color: var(--text-main);
    }

    .session-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-menu-trigger {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: color 0.2s, background 0.2s;
    }

    .session-menu-trigger:hover {
      color: var(--text-main);
      background: var(--border-color);
    }

    /* Main Container */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background: var(--bg-main); 
      backdrop-filter: blur(2px);
      padding-top: 60px;
    }

    /* PREMIUM FROSTED TOP BAR - Theme Agnostic */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 10, 10, 0.15); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 30px var(--dynamic-glow);
      z-index: 50;
      flex-shrink: 0;
      transition: box-shadow 0.8s ease;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: var(--bg-card);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      /* Enforcing stroke usage for new premium icons */
      stroke: currentColor;
      fill: none;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .brand-title h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--dynamic-color);
      text-shadow: 0 1px 8px var(--dynamic-glow);
      transition: color 0.8s ease, text-shadow 0.8s ease;
    }

    /* PWA Install Pill Container */
    .install-pill-container {
      position: absolute;
      top: 66px; 
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 45; 
      pointer-events: none; 
    }

    .install-pill {
      display: none;
      pointer-events: auto; 
      align-items: center;
      gap: 6px;
      background: var(--dynamic-color);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      box-shadow: 0 4px 15px var(--dynamic-glow);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    /* Chat Messages Window */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0); 
    }
    
    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 90%;
      position: relative;
    }
    .message-wrapper.user { align-items: flex-end; align-self: flex-end; max-width: 85%; }
    .message-wrapper.ai { align-items: flex-start; align-self: flex-start; max-width: 100%; width: 100%; }

    .message {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      backdrop-filter: blur(15px); 
      -webkit-backdrop-filter: blur(15px);
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .message.user {
      background-color: var(--user-msg);
      color: var(--text-main); 
      border-bottom-right-radius: 4px;
      border: 1px solid var(--border-color);
    }

    .message.ai {
      background-color: var(--ai-msg);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }
    
    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      padding: 0 4px;
    }
    .msg-action-icon {
      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .msg-action-icon:hover, .msg-action-icon:active {
      color: var(--dynamic-color);
      background: var(--bg-card);
      border-color: var(--dynamic-color);
    }
    .msg-action-icon svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
    }

    /* Gemini Thinking Loader */
    .thinking-container {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 15px;
      max-width: 320px;
      padding: 10px 18px;
      background-color: var(--bg-card);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .thinking-header {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
      transition: opacity 0.3s ease;
    }
    
    .thinking-logo-container {
      position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; 
    }
    .thinking-spinner {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid transparent; 
      border-top-color: var(--dynamic-color); 
      border-radius: 50%; 
      animation: spin 1s linear infinite; z-index: 1; 
      box-shadow: 0 0 10px var(--dynamic-glow);
    }
    .thinking-logo { 
      width: 24px; height: 24px; z-index: 2; border-radius: 50%; animation: pulse-logo 2s ease-in-out infinite; object-fit: cover;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulse-logo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /* PROFESSIONAL FROSTED INPUT CONTAINER */
    .input-container {
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      margin-top: auto;
      background: transparent; 
      z-index: 50; 
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      background: rgba(20, 20, 20, 0.4);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 8px 12px 8px 18px;
      box-shadow: 0 0 20px var(--dynamic-glow), inset 0 0 10px rgba(255,255,255,0.02);
      gap: 10px;
      margin-bottom: 15px; 
      transition: border-color 0.5s ease, box-shadow 0.5s ease, transform 0.2s;
    }
    
    .input-box:focus-within {
      border-color: var(--dynamic-color);
      box-shadow: 0 0 30px var(--dynamic-glow), inset 0 0 10px rgba(255,255,255,0.05);
      transform: translateY(-2px);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      resize: none;
      max-height: 140px;
      font-size: 0.95rem;
      line-height: 1.45;
      padding: 10px 0; /* Aligned vertically */
      overscroll-behavior-y: contain;
    }

    /* ACTION BUTTON OVERHAUL: Strict Shapes & Professional Flex Rules */
    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      width: 40px;
      height: 40px;
      min-width: 40px; /* Forces exact shape */
      min-height: 40px; /* Forces exact shape */
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      flex-shrink: 0; /* Prevents squishing */
      margin-bottom: 2px; /* Bottom alignment */
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
    }

    /* Frosted Mic Button */
    .mic-btn {
      background: rgba(100, 100, 100, 0.15); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
    }

    .mic-btn:hover {
      background: rgba(150, 150, 150, 0.25);
      color: var(--text-main);
    }

    .mic-btn.listening {
      color: var(--dynamic-color);
      animation: pulse-mic 1s infinite;
      border-color: var(--dynamic-color);
    }

    @keyframes pulse-mic {
      0% { transform: scale(1); box-shadow: 0 0 10px var(--dynamic-glow); }
      50% { transform: scale(1.15); box-shadow: 0 0 20px var(--dynamic-glow); }
      100% { transform: scale(1); box-shadow: 0 0 10px var(--dynamic-glow); }
    }

    /* Dynamic Send Button */
    .send-btn {
      background: var(--dynamic-color);
      color: #ffffff;
      box-shadow: 0 0 15px var(--dynamic-glow);
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.5s ease, box-shadow 0.5s ease, transform 0.1s;
    }

    .send-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--dynamic-glow);
    }
    
    .send-btn:active {
      transform: scale(0.95);
    }

    /* Mobile Bottom Sheet Modal */
    .bottom-sheet-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .bottom-sheet-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--border-color);
      padding: 20px 20px 32px 20px;
      z-index: 1200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
    }

    .bottom-sheet.active {
      transform: translateY(0);
    }

    .bottom-sheet-handle {
      width: 40px;
      height: 5px;
      background: var(--border-color);
      border-radius: 10px;
      align-self: center;
      margin-bottom: 8px;
    }

    .sheet-option {
      padding: 14px 16px;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.2s;
    }

    .sheet-option:hover {
      background: rgba(255,255,255,0.05);
    }

    .sheet-option.danger {
      color: var(--danger);
    }

    .sheet-option.danger:hover {
      background: rgba(239, 68, 68, 0.15);
    }

    /* Custom Rename Modal */
    .rename-modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 1300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .rename-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .rename-modal {
      background: var(--bg-card);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    .rename-modal h3 {
      font-size: 1.15rem;
      color: var(--text-main);
    }

    .rename-modal input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: rgba(0,0,0,0.2);
      color: var(--text-main);
      outline: none;
      font-size: 1rem;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .rename-modal input:focus {
      border-color: var(--dynamic-color);
      box-shadow: 0 0 10px var(--dynamic-glow);
    }

    .rename-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-secondary {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
    }

    .btn-primary {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      background: var(--dynamic-color);
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
      box-shadow: 0 4px 15px var(--dynamic-glow);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px var(--dynamic-glow);
    }
  </style>
</head>
<body>

  <!-- WebGL 3D Background Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-label="Close sidebar" onclick="closeAllOverlays()"></div>

  <!-- Sidebar Navigation Drawer -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="icon.png" alt="MindGuard-AI Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2965/2965358.png'">
      <h2>MindGuard-AI</h2>
    </div>
    <button class="new-chat-btn" onclick="createNewSession()" aria-label="Start new conversation">
      <!-- Premium New Chat Icon -->
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path><line x1="12" y1="9" x2="12" y2="15"></line><line x1="9" y1="12" x2="15" y2="12"></line></svg>
      New Conversation
    </button>

  <!-- MOOD RESPONSIVE 3D BACKGROUND ENGINE WITH ADVANCED PHYSICS -->
  <script>
    // 3D Engine Variables
    let scene, camera, renderer, blobMesh, uniforms;
    let targetColorA = new THREE.Color(0x3a3a4a); 
    let targetColorB = new THREE.Color(0x1e1e24);
    let currentColorA = new THREE.Color(0x3a3a4a);
    let currentColorB = new THREE.Color(0x1e1e24);
    
    // Advanced Physics Targets (Now includes Pulse Speed & Y-Axis Floating)
    let targetDistortion = 0.4;
    let currentDistortion = 0.4;
    let targetSpeed = 0.5;
    let currentSpeed = 0.5;
    let targetRotationSpeed = 0.002;
    let currentRotationSpeed = 0.002;
    let targetScale = 1.0;
    let currentScale = 1.0;
    let targetPulse = 0.0;
    let currentPulse = 0.0;
    let targetPulseSpeed = 0.005;
    let currentPulseSpeed = 0.005;
    let targetYOffset = -0.2;
    let currentYOffset = -0.2;
    
    // Complete 19 Emotion Map: Synced Scale, Shape, Pulse, Y-Float, Motion & UI Colors
    const moodPalettes = {
        "neutral":     { a: 0x3a3a4a, b: 0x222233, distortion: 0.3, speed: 0.3, rotSpeed: 0.002, scale: 1.0, pulse: 0.0, pSpeed: 0.0, yOff: -0.2 },
        "calm":        { a: 0x2b5876, b: 0x4e4376, distortion: 0.2, speed: 0.2, rotSpeed: 0.001, scale: 0.9, pulse: 0.02, pSpeed: 0.002, yOff: -0.2 },
        "happy":       { a: 0xffd194, b: 0x70e1f5, distortion: 0.6, speed: 0.8, rotSpeed: 0.005, scale: 1.15, pulse: 0.05, pSpeed: 0.008, yOff: 0.0 }, // Floats up
        "hopeful":     { a: 0xa8ff78, b: 0x78ffd6, distortion: 0.4, speed: 0.5, rotSpeed: 0.004, scale: 1.05, pulse: 0.03, pSpeed: 0.005, yOff: -0.1 },
        "grateful":    { a: 0xfbd3e9, b: 0xbb377d, distortion: 0.3, speed: 0.4, rotSpeed: 0.003, scale: 1.0, pulse: 0.02, pSpeed: 0.004, yOff: -0.2 },
        "motivated":   { a: 0xf9d423, b: 0xff4e50, distortion: 0.7, speed: 0.9, rotSpeed: 0.006, scale: 1.2, pulse: 0.06, pSpeed: 0.01, yOff: 0.1 }, // Floats up & beats
        "anxious":     { a: 0xff4b2b, b: 0xff416c, distortion: 1.2, speed: 1.5, rotSpeed: 0.015, scale: 0.85, pulse: 0.15, pSpeed: 0.025, yOff: -0.3 }, // Low & jittery
        "panicked":    { a: 0xffa500, b: 0xd91e18, distortion: 2.5, speed: 2.5, rotSpeed: 0.035, scale: 1.4, pulse: 0.2, pSpeed: 0.04, yOff: -0.1 }, 
        "angry":       { a: 0x8a2387, b: 0xe94057, distortion: 1.8, speed: 1.8, rotSpeed: 0.018, scale: 1.3, pulse: 0.1, pSpeed: 0.02, yOff: 0.0 },
        "frustrated":  { a: 0xc31432, b: 0x240b36, distortion: 1.3, speed: 1.4, rotSpeed: 0.012, scale: 1.1, pulse: 0.08, pSpeed: 0.015, yOff: -0.2 },
        "sad":         { a: 0x141e30, b: 0x243b55, distortion: 0.1, speed: 0.1, rotSpeed: 0.001, scale: 0.6, pulse: 0.01, pSpeed: 0.001, yOff: -0.5 }, // Sinks down
        "grieving":    { a: 0x111111, b: 0x333333, distortion: 0.05, speed: 0.05, rotSpeed: 0.0005, scale: 0.5, pulse: 0.005, pSpeed: 0.0005, yOff: -0.6 }, // Smallest, lowest
        "lonely":      { a: 0x4ca1af, b: 0xc4e0e5, distortion: 0.1, speed: 0.15, rotSpeed: 0.001, scale: 0.7, pulse: 0.01, pSpeed: 0.002, yOff: -0.4 }, 
        "exhausted":   { a: 0x5c258d, b: 0x4389a2, distortion: 0.1, speed: 0.05, rotSpeed: 0.0008, scale: 0.65, pulse: 0.02, pSpeed: 0.001, yOff: -0.5 }, 
        "overwhelmed": { a: 0x8e0e00, b: 0x1f1c18, distortion: 1.6, speed: 1.0, rotSpeed: 0.01, scale: 1.35, pulse: 0.12, pSpeed: 0.03, yOff: -0.1 }, 
        "numb":        { a: 0xbdc3c7, b: 0x2c3e50, distortion: 0.0, speed: 0.0, rotSpeed: 0.000, scale: 0.75, pulse: 0.0, pSpeed: 0.0, yOff: -0.3 }, 
        "insecure":    { a: 0x3a6186, b: 0x89253e, distortion: 0.5, speed: 0.6, rotSpeed: 0.004, scale: 0.85, pulse: 0.05, pSpeed: 0.015, yOff: -0.4 },
        "thinking":    { a: 0x8e2de2, b: 0x4a00e0, distortion: 0.8, speed: 1.2, rotSpeed: 0.012, scale: 1.0, pulse: 0.05, pSpeed: 0.01, yOff: -0.1 }, 
        "typing":      { a: 0x00c6ff, b: 0x0072ff, distortion: 0.6, speed: 1.0, rotSpeed: 0.015, scale: 1.15, pulse: 0.12, pSpeed: 0.015, yOff: 0.0 }  
    };

    function init3DBackground() {
        const canvas = document.getElementById('webgl-canvas');
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 6; 

        // Advanced Vertex Shader
        const vertexShader = `
            uniform float uTime;
            uniform float uDistortion;
            uniform float uSpeed;
            varying vec2 vUv;
            varying vec3 vNormal;

            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

            float snoise(vec3 v) { 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0);
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i); 
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                          + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                          + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 0.142857142857;
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vUv = uv;
                vNormal = normal;
                
                vec3 pos = position;
                float noise = snoise(vec3(pos.x * 2.0, pos.y * 2.0, pos.z * 2.0 + (uTime * uSpeed)));
                pos += normal * noise * uDistortion;
                
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        // Advanced Fragment Shader with Fresnel Rim Lighting
        const fragmentShader = `
            uniform vec3 uColorA;
            uniform vec3 uColorB;
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vNormal;

            void main() {
                float mixStrength = dot(vNormal, vec3(0.5, 0.5, 1.0)) * 0.5 + 0.5;
                mixStrength += sin(vUv.y * 10.0 + uTime) * 0.1;
                
                vec3 baseColor = mix(uColorA, uColorB, clamp(mixStrength, 0.0, 1.0));
                
                float fresnel = pow(1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.5);
                vec3 rimLight = uColorB * fresnel * 2.0; 
                
                vec3 finalColor = baseColor + rimLight;

                gl_FragColor = vec4(finalColor, 0.95); 
            }
        `;

        uniforms = {
            uTime: { value: 0 },
            uDistortion: { value: currentDistortion },
            uSpeed: { value: currentSpeed },
            uColorA: { value: currentColorA },
            uColorB: { value: currentColorB }
        };

        const geometry = new THREE.IcosahedronGeometry(2, 64);
        const material = new THREE.ShaderMaterial({
            vertexShader: vertexShader,
            fragmentShader: fragmentShader,
            uniforms: uniforms,
            wireframe: false,
            transparent: true
        });

        blobMesh = new THREE.Mesh(geometry, material);
        blobMesh.position.set(0, currentYOffset, 0);
        scene.add(blobMesh);

        window.addEventListener('resize', onWindowResize, false);
        animate3D();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate3D(time) {
        requestAnimationFrame(animate3D);
        
        uniforms.uTime.value = time * 0.001;

        // Smooth Physics Interpolation
        currentColorA.lerp(targetColorA, 0.02);
        currentColorB.lerp(targetColorB, 0.02);
        currentDistortion += (targetDistortion - currentDistortion) * 0.02;
        currentSpeed += (targetSpeed - currentSpeed) * 0.02;
        currentScale += (targetScale - currentScale) * 0.05;
        currentPulse += (targetPulse - currentPulse) * 0.05;
        currentPulseSpeed += (targetPulseSpeed - currentPulseSpeed) * 0.05;
        currentYOffset += (targetYOffset - currentYOffset) * 0.05;
        currentRotationSpeed += (targetRotationSpeed - currentRotationSpeed) * 0.05;

        // Apply Shader Uniforms
        uniforms.uColorA.value = currentColorA;
        uniforms.uColorB.value = currentColorB;
        uniforms.uDistortion.value = currentDistortion;
        uniforms.uSpeed.value = currentSpeed;
        
        // Apply Dynamic Scale & Pulse Sine Wave
        let scaleWithPulse = currentScale + Math.sin(time * currentPulseSpeed) * currentPulse;
        blobMesh.scale.set(scaleWithPulse, scaleWithPulse, scaleWithPulse);

        // Apply Vertical Float
        blobMesh.position.y = currentYOffset;

        // Apply Rotational Inertia
        blobMesh.rotation.y += currentRotationSpeed;
        blobMesh.rotation.x += currentRotationSpeed * 0.5;

        renderer.render(scene, camera);
    }

    // MASTER SYNC ENGINE
    window.setMoodState = function(moodName) {
        const palette = moodPalettes[moodName] || moodPalettes["neutral"];
        
        // 1. Update 3D Physics Targets
        targetColorA.setHex(palette.a);
        targetColorB.setHex(palette.b);
        targetDistortion = palette.distortion;
        targetSpeed = palette.speed;
        targetRotationSpeed = palette.rotSpeed;
        targetScale = palette.scale;
        targetPulse = palette.pulse;
        targetPulseSpeed = palette.pSpeed;
        targetYOffset = palette.yOff;

        // 2. Extract Glow & Sync UI CSS
        const r = (palette.b >> 16) & 255;
        const g = (palette.b >> 8) & 255;
        const b = palette.b & 255;
        const cssHex = '#' + palette.b.toString(16).padStart(6, '0');
        const cssRgbaGlow = `rgba(${r}, ${g}, ${b}, 0.5)`;

        document.documentElement.style.setProperty('--dynamic-color', cssHex);
        document.documentElement.style.setProperty('--dynamic-glow', cssRgbaGlow);
    };

    // Typing State Trigger
    let typingTimer;
    function handleTyping() {
        window.setMoodState("typing");
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            window.setMoodState(state.lastAiMood); 
        }, 1200);
    }
  </script>

  <!-- MAIN APPLICATION LOGIC -->
  <script>
    let state = {
      sessions: {},
      currentSessionId: null,
      selectedTargetSessionId: null,
      lastAiMood: "neutral" 
    };

    let speechRecognizer = null;
    let isListening = false;
    let deferredPrompt = null;
    let activeOverlayStack = [];

    const INITIAL_WELCOME = "Hello! I am MindGuard-AI. How are you feeling today? You can share your mood, stress levels, or daily sleep quality.";

    const thinkingPhrases = [
      "Analyzing emotional subtext...",
      "Evaluating stress indicators...",
      "Mapping cognitive frameworks...",
      "Synthesizing psychological insights...",
      "Processing tonal nuances...",
      "Formulating empathetic response...",
      "Generating actionable relief...",
      "MindGuard-AI is almost ready..."
    ];

    function triggerHaptic(pattern = 15) {
      if (navigator.vibrate) {
        navigator.vibrate(pattern);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      init3DBackground(); 
      window.setMoodState(state.lastAiMood);
      loadStateFromStorage();
      setupSystemThemeEngine();
      registerPWA();
      setupSpeechRecognition();
      setupHistoryBackHandler();
      setupViewportLock(); 
      renderSidebar();
      renderCurrentChat();
    });

    function setupViewportLock() {
      function lockViewportAndHeader() {
          const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.body.style.height = vh + 'px';
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
      }
      if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', lockViewportAndHeader);
          window.visualViewport.addEventListener('scroll', lockViewportAndHeader);
      }
      window.addEventListener('resize', lockViewportAndHeader);
      
      const inputEl = document.getElementById('userInput');
      inputEl.addEventListener('focus', () => {
          setTimeout(lockViewportAndHeader, 10);
          setTimeout(lockViewportAndHeader, 300);
      });
      inputEl.addEventListener('blur', () => {
          setTimeout(lockViewportAndHeader, 100);
          window.setMoodState(state.lastAiMood);
      });
    }

    function setupSystemThemeEngine() {
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      
      const applySystemTheme = (e) => {
        const isDark = e.matches;
        document.body.classList.toggle('light-mode', !isDark);
        const metaTheme = document.getElementById('metaThemeColor');
        if (metaTheme) {
          metaTheme.setAttribute('content', isDark ? '#121212' : '#f4f4f5');
        }
      };
      applySystemTheme(mediaQuery);
      mediaQuery.addEventListener('change', applySystemTheme);
    }

    function setupHistoryBackHandler() {
      window.history.replaceState({ root: true }, '');
      window.addEventListener('popstate', (e) => {
        if (activeOverlayStack.length > 0) {
          const topOverlay = activeOverlayStack.pop();
          closeOverlayUI(topOverlay);
        }
      });
    }

    function pushOverlayState(overlayName) {
      activeOverlayStack.push(overlayName);
      window.history.pushState({ overlay: overlayName }, '');
    }

    function closeAllOverlays() {
      const stackSize = activeOverlayStack.length;
      if (stackSize > 0) {
        window.history.go(-stackSize);
        activeOverlayStack.forEach(overlay => closeOverlayUI(overlay));
        activeOverlayStack = [];
      }
    }

    function closeOverlayUI(overlayName) {
      if (overlayName === 'sidebar') {
        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('sidebarOverlay').classList.remove('active');
      } else if (overlayName === 'bottomSheet') {
        document.getElementById('bottomSheet').classList.remove('active');
        document.getElementById('bottomSheetOverlay').classList.remove('active');
      } else if (overlayName === 'renameModal') {
        document.getElementById('renameModalOverlay').classList.remove('active');
      }
    }

    function openSidebar() {
      triggerHaptic();
      document.getElementById('sidebar').classList.add('active');
      document.getElementById('sidebarOverlay').classList.add('active');
      pushOverlayState('sidebar');
    }

    function openBottomSheet(sessionId, event) {
      triggerHaptic();
      event.stopPropagation();
      state.selectedTargetSessionId = sessionId;
      document.getElementById('bottomSheet').classList.add('active');
      document.getElementById('bottomSheetOverlay').classList.add('active');
      pushOverlayState('bottomSheet');
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('micBtn').style.display = 'none';
        return;
      }

      speechRecognizer = new SpeechRecognition();
      speechRecognizer.continuous = false;
      speechRecognizer.interimResults = false;
      speechRecognizer.lang = 'en-US';

      speechRecognizer.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        window.setMoodState("typing"); 
      };

      speechRecognizer.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        window.setMoodState(state.lastAiMood);
      };

      speechRecognizer.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const inputEl = document.getElementById('userInput');
        inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + transcript;
        autoResizeInput(inputEl);
      };

      speechRecognizer.onerror = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
        window.setMoodState(state.lastAiMood);
      };
    }

    function toggleSpeechRecognition() {
      triggerHaptic();
      if (!speechRecognizer) return;
      if (isListening) {
        speechRecognizer.stop();
      } else {
        speechRecognizer.start();
      }
    }

    function loadStateFromStorage() {
      const savedSessions = localStorage.getItem('mg_sessions');
      const savedActiveId = localStorage.getItem('mg_active_id');
      const savedMood = localStorage.getItem('mg_last_mood');

      if (savedSessions) {
        state.sessions = JSON.parse(savedSessions);
      }

      if (savedMood) {
        state.lastAiMood = savedMood;
        window.setMoodState(savedMood);
      }

      if (savedActiveId && state.sessions[savedActiveId]) {
        state.currentSessionId = savedActiveId;
      } else {
        createNewSession(false);
      }
    }

    function saveStateToStorage() {
      Object.values(state.sessions).forEach(session => {
        if (session.history.length > 100) {
          session.history = session.history.slice(-100);
        }
      });
      
      localStorage.setItem('mg_sessions', JSON.stringify(state.sessions));
      localStorage.setItem('mg_active_id', state.currentSessionId);
      localStorage.setItem('mg_last_mood', state.lastAiMood);
    }

    function createNewSession(shouldRender = true) {
      if (shouldRender) triggerHaptic();
      const newId = 'session_' + Date.now();
      state.sessions[newId] = {
        id: newId,
        title: 'New Conversation',
        history: [
          { role: 'model', parts: [{ text: INITIAL_WELCOME }] }
        ]
      };
      state.currentSessionId = newId;
      state.lastAiMood = "neutral";
      saveStateToStorage();

      if (shouldRender) {
        renderSidebar();
        renderCurrentChat();
        closeAllOverlays();
        window.setMoodState("neutral");
      }
    }

    function switchSession(id) {
      triggerHaptic();
      if (!state.sessions[id]) return;
      state.currentSessionId = id;
      saveStateToStorage();
      renderSidebar();
      renderCurrentChat();
      closeAllOverlays();
      state.lastAiMood = "neutral"; 
      window.setMoodState("neutral");
    }

    function triggerDeleteSession() {
      triggerHaptic([30, 50, 30]); 
      const id = state.selectedTargetSessionId;
      if (!id || !state.sessions[id]) return;

      delete state.sessions[id];
      const remainingIds = Object.keys(state.sessions);

      if (remainingIds.length === 0) {
        createNewSession(false);
      } else if (state.currentSessionId === id) {
        state.currentSessionId = remainingIds[remainingIds.length - 1];
      }

      saveStateToStorage();
      renderSidebar();
      renderCurrentChat();
      closeAllOverlays();
    }

    function triggerRenameSession() {
      triggerHaptic();
      const id = state.selectedTargetSessionId;
      if (!id || !state.sessions[id]) return;

      const currentTitle = state.sessions[id].title;
      const inputEl = document.getElementById('renameInput');
      inputEl.value = currentTitle;

      document.getElementById('renameModalOverlay').classList.add('active');
      pushOverlayState('renameModal');
      setTimeout(() => inputEl.focus(), 100);
    }

    function saveSessionRename() {
      triggerHaptic();
      const id = state.selectedTargetSessionId;
      const inputEl = document.getElementById('renameInput');
      const newTitle = inputEl.value.trim();

      if (id && state.sessions[id] && newTitle) {
        state.sessions[id].title = newTitle;
        saveStateToStorage();
        renderSidebar();
      }
      closeAllOverlays();
    }

    function closeRenameModal() {
      closeAllOverlays();
    }

    function renderSidebar() {
      const listEl = document.getElementById('sessionList');
      listEl.innerHTML = '';

      Object.values(state.sessions).reverse().forEach(session => {
        const item = document.createElement('div');
        item.classList.add('session-item');
        if (session.id === state.currentSessionId) item.classList.add('active');

        item.onclick = () => switchSession(session.id);
        item.innerHTML = `
          <span class="session-title">💬 ${escapeHTML(session.title)}</span>
          <button class="session-menu-trigger" aria-label="Session Options" onclick="openBottomSheet('${session.id}', event)">⋮</button>
        `;
        listEl.appendChild(item);
      });
    }

    function renderCurrentChat() {
      const chatBox = document.getElementById('chatBox');
      
      chatBox.style.scrollBehavior = 'auto';
      chatBox.innerHTML = '';

      const activeSession = state.sessions[state.currentSessionId];
      if (!activeSession) return;

      activeSession.history.forEach(msg => {
        const type = msg.role === 'model' ? 'ai' : 'user';
        let textContent = msg.parts[0].text;
        try {
            const parsed = JSON.parse(textContent);
            if (parsed.text) textContent = parsed.text;
        } catch (e) {} 

        appendMessageUI(textContent, type);
      });
      
      chatBox.scrollTop = chatBox.scrollHeight;
      setTimeout(() => {
          chatBox.style.scrollBehavior = 'smooth';
      }, 50);
    }

    async function sendMessage() {
      triggerHaptic();
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';

      const activeSession = state.sessions[state.currentSessionId];
      
      if (activeSession.history.length <= 1) {
        activeSession.title = text.length > 22 ? text.substring(0, 22) + '...' : text;
        renderSidebar();
      }

      appendMessageUI(text, 'user');
      activeSession.history.push({ role: 'user', parts: [{ text }] });
      saveStateToStorage();

      window.setMoodState("thinking");
      const thinkingEl = showThinkingAnimation();

      try {
        const response = await fetch('https://project-9uo5.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: activeSession.history })
        });

        const data = await response.json();
        thinkingEl.remove(); 

        if (response.status === 429) {
          appendMessageUI(data.error || "Rate limit exceeded. Please wait a minute.", 'ai');
          window.setMoodState(state.lastAiMood);
        } else if (data.text) {
          
          if (data.mood) {
              state.lastAiMood = data.mood;
              window.setMoodState(data.mood);
              renderSidebar(); // Update sidebar active glow instantly
          } else {
              state.lastAiMood = "neutral";
              window.setMoodState("neutral");
          }

          appendMessageUI(data.text, 'ai');
          activeSession.history.push({ role: 'model', parts: [{ text: data.text }] });
          saveStateToStorage();
        } else {
          appendMessageUI("Unable to process response at this time.", 'ai');
          window.setMoodState(state.lastAiMood);
        }
      } catch (err) {
        thinkingEl.remove();
        appendMessageUI("Network error: Failed to connect to MindGuard engine.", 'ai');
        window.setMoodState(state.lastAiMood);
      }
    }

    function appendMessageUI(text, sender) {
      const chatBox = document.getElementById('chatBox');
      
      const wrapperDiv = document.createElement('div');
      wrapperDiv.classList.add('message-wrapper', sender);
      
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;
      
      msgDiv.addEventListener('dblclick', () => {
         navigator.clipboard.writeText(text);
      });
      
      wrapperDiv.appendChild(msgDiv);
      
      if (sender === 'ai') {
        const actionsDiv = document.createElement('div');
        actionsDiv.classList.add('message-actions');
        // Professional Stroke Icons for Copy & Speak
        actionsDiv.innerHTML = `
          <button class="msg-action-icon" aria-label="Copy message" onclick="copyMessageText(this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
          <button class="msg-action-icon" aria-label="Speak message" onclick="speakMessageText(this)">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
          </button>
        `;
        wrapperDiv.appendChild(actionsDiv);
      }
      
      chatBox.appendChild(wrapperDiv);
      
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
      
      return msgDiv;
    }
    
    window.copyMessageText = function(btn) {
       triggerHaptic(20);
       const wrapper = btn.closest('.message-wrapper');
       const text = wrapper.querySelector('.message').innerText;
       navigator.clipboard.writeText(text);
       btn.style.color = 'var(--dynamic-color)';
       setTimeout(() => btn.style.color = 'var(--text-sub)', 1500);
    };
    
    window.speakMessageText = function(btn) {
       triggerHaptic(20);
       const wrapper = btn.closest('.message-wrapper');
       const text = wrapper.querySelector('.message').innerText;
       
       if (window.speechSynthesis.speaking) {
           window.speechSynthesis.cancel();
       } else {
           const utterance = new SpeechSynthesisUtterance(text);
           window.speechSynthesis.speak(utterance);
       }
    };

    function showThinkingAnimation() {
      const chatBox = document.getElementById('chatBox');
      const container = document.createElement('div');
      container.classList.add('thinking-container');
      
      container.innerHTML = `
        <div class="thinking-logo-container">
            <div class="thinking-spinner"></div>
            <img src="icon.png" class="thinking-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2965/2965358.png'">
        </div>
        <div class="thinking-header" id="dynamicThinkingText">Processing data...</div>
      `;
      chatBox.appendChild(container);
      
      const dynamicTextEl = container.querySelector('#dynamicThinkingText');
      let phraseIndex = 0;
      
      const cycleInterval = setInterval(() => {
          dynamicTextEl.style.opacity = 0; 
          
          setTimeout(() => {
              dynamicTextEl.innerText = thinkingPhrases[phraseIndex % thinkingPhrases.length];
              dynamicTextEl.style.opacity = 1; 
              phraseIndex++;
          }, 300); 
          
      }, 1500); 

      const originalRemove = container.remove.bind(container);
      container.remove = () => {
          clearInterval(cycleInterval);
          originalRemove();
      };
      
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
      
      return container;
    }

    function registerPWA() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker Active'))
          .catch(err => console.log('SW Registration Failed:', err));
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installPill = document.getElementById('installPill');
        if (installPill) installPill.style.display = 'flex';
      });
    }

    function installPWA() {
      triggerHaptic();
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installPill').style.display = 'none';
      });
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      } else {
        autoResizeInput(e.target);
      }
    }

    function autoResizeInput(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
