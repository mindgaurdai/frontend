<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MindGuard-AI</title>
  
  <!-- PWA & Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" id="metaThemeColor" content="#121212">
  <meta name="description" content="AI that detects wellbeing changes before they become crises.">

  <style>
    /* CSS Variables for Dynamic System Dark / Light Theme (Powerful Gray Palette) */
    :root {
      --bg-main: #121212;
      --bg-card: #1e1e1e;
      --bg-sidebar: #0a0a0a;
      --border-color: #333333;
      --text-main: #e4e4e7;
      --text-sub: #a1a1aa;
      --accent: #52525b;
      --accent-hover: #71717a;
      --user-msg: #3f3f46;
      --ai-msg: #1e1e1e;
      --input-bg: #1e1e1e;
      --overlay-bg: rgba(0, 0, 0, 0.7);
      --shimmer-1: #1e1e1e;
      --shimmer-2: #333333;
      --shadow: rgba(0, 0, 0, 0.4);
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    /* Light Mode Overrides (Powerful Light Gray Palette) */
    body.light-mode {
      --bg-main: #f4f4f5;
      --bg-card: #ffffff;
      --bg-sidebar: #e4e4e7;
      --border-color: #d4d4d8;
      --text-main: #18181b;
      --text-sub: #52525b;
      --accent: #3f3f46;
      --accent-hover: #27272a;
      --user-msg: #52525b;
      --ai-msg: #ffffff;
      --input-bg: #ffffff;
      --overlay-bg: rgba(24, 24, 27, 0.5);
      --shimmer-1: #e4e4e7;
      --shimmer-2: #f4f4f5;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      /* Prevents mobile browser overscroll/rubber-banding (far back view fix) */
      overscroll-behavior-y: none;
      background-color: var(--bg-main);
      color: var(--text-main);
      width: 100%;
      height: 100dvh; /* Dynamic Viewport Height fixes keyboard pushing layout out */
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      transition: background-color 0.25s, color 0.25s;
    }

    /* Custom Webkit Scrollbars for Professional Look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
      display: none; /* Hide for cleaner native app look based on previous implementation */
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-sub);
    }
    * {
      -ms-overflow-style: none;  
      scrollbar-width: none;  
    }

    /* Sidebar - Navigation Drawer */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(3px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      width: 300px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.active {
      transform: translateX(0);
    }

    @media (min-width: 900px) {
      .sidebar {
        position: static;
        transform: none !important;
      }
      .sidebar-overlay {
        display: none !important;
      }
      .menu-btn {
        display: none !important;
      }
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: none; /* Border removed as requested */
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      object-fit: cover;
    }

    .sidebar-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.3px;
    }

    .new-chat-btn {
      margin: 12px 16px;
      padding: 12px 16px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .new-chat-btn:active {
      transform: scale(0.98);
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .session-item {
      padding: 12px;
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background 0.15s;
    }

    .session-item:hover, .session-item.active {
      background-color: var(--bg-card);
    }

    .session-item.active {
      font-weight: 600;
      border-left: 3px solid var(--accent);
    }

    .session-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session-menu-trigger {
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: color 0.15s, background 0.15s;
    }

    .session-menu-trigger:hover {
      color: var(--text-main);
      background: var(--border-color);
    }

    /* Main Container */
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
      background: var(--bg-main);
      padding-top: 60px; /* Offset for absolute top-bar */
    }

    /* Top Navigation Header - UPDATED FOR NATIVE ABSOLUTE POSITIONING */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      padding: 0 16px;
      border-bottom: none; /* Border removed as requested */
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-main);
      z-index: 2000;
      flex-shrink: 0;
    }

    .top-bar-left, .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-card);
    }

    .icon-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .brand-title h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* PWA Install Pill */
    .install-pill {
      display: none;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(82, 82, 91, 0.4);
      transition: background 0.2s;
    }
    
    .install-pill:hover {
      background: var(--accent-hover);
    }

    /* Chat Messages Window - UPDATED INDEPENDENT SCROLL ZONE */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      transform: translateZ(0); /* Hardware acceleration */
    }
    
    /* NEW: Message Wrapper to handle actions alignment */
    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 90%;
      position: relative;
    }
    .message-wrapper.user { align-items: flex-end; align-self: flex-end; max-width: 85%; }
    .message-wrapper.ai { align-items: flex-start; align-self: flex-start; max-width: 100%; width: 100%; }

    .message {
      padding: 14px 18px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 0.95rem;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 2px 6px var(--shadow);
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    .message.user {
      background-color: var(--user-msg);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      background-color: var(--ai-msg);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border-color);
    }
    
    /* NEW: Message Action Buttons (Copy & Speak) */
    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      padding: 0 4px;
    }
    .msg-action-icon {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }
    .msg-action-icon:hover, .msg-action-icon:active {
      color: var(--text-main);
      background: var(--bg-card);
    }
    .msg-action-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Gemini Thinking Loader - UPDATED FOR NATIVE SPINNER */
    .thinking-container {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 15px;
      max-width: 320px;
      padding: 10px 18px;
      background-color: transparent;
      border: none;
    }

    .thinking-header {
      font-size: 0.9rem;
      color: var(--text-main);
      font-weight: 500;
      animation: pulseText 1.5s ease-in-out infinite;
    }
    
    .thinking-logo-container {
      position: relative; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; 
    }
    .thinking-spinner {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid transparent; 
      border-top-color: var(--accent); border-right-color: var(--accent-hover); border-radius: 50%; 
      animation: spin 1s linear infinite; z-index: 1; 
    }
    .thinking-logo { 
      width: 24px; height: 24px; z-index: 2; border-radius: 50%; animation: pulse-logo 2s ease-in-out infinite; object-fit: cover;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes pulse-logo { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /* Maintained original shimmer CSS just in case */
    .shimmer-line {
      height: 10px;
      width: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--shimmer-1) 25%, var(--shimmer-2) 50%, var(--shimmer-1) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Floating Input Box - UPDATED BOTTOM ANCHOR AND SAFE AREA */
    .input-container {
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom)); /* Fixed native safe area padding */
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      margin-top: auto;
      background: var(--bg-main);
      z-index: 1000;
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 8px 12px 8px 18px;
      box-shadow: 0 4px 16px var(--shadow);
      gap: 8px;
      transition: all 0.3s ease;
    }
    
    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 -2px 15px rgba(0,0,0,0.2);
      transform: translateY(-1px);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      outline: none;
      resize: none;
      max-height: 140px;
      font-size: 0.95rem;
      line-height: 1.45;
      padding: 6px 0;
      overscroll-behavior-y: contain;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .action-btn:hover {
      color: var(--text-main);
      background: var(--bg-main);
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .action-btn.listening {
      color: var(--danger);
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .send-btn {
      background: var(--accent);
      color: #ffffff;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    /* Mobile Bottom Sheet Modal */
    .bottom-sheet-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(2px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .bottom-sheet-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-card);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-top: 1px solid var(--border-color);
      padding: 20px 20px 32px 20px;
      z-index: 210;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 500px;
      margin: 0 auto;
    }

    .bottom-sheet.active {
      transform: translateY(0);
    }

    .bottom-sheet-handle {
      width: 40px;
      height: 5px;
      background: var(--border-color);
      border-radius: 10px;
      align-self: center;
      margin-bottom: 8px;
    }

    .sheet-option {
      padding: 14px 16px;
      border-radius: 12px;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }

    .sheet-option:hover {
      background: var(--bg-main);
    }

    .sheet-option.danger {
      color: var(--danger);
    }

    .sheet-option.danger:hover {
      background: rgba(239, 68, 68, 0.1);
    }

    /* Custom Rename Modal */
    .rename-modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      backdrop-filter: blur(3px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .rename-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .rename-modal {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px var(--shadow);
    }

    .rename-modal h3 {
      font-size: 1.1rem;
      color: var(--text-main);
    }

    .rename-modal input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-main);
      color: var(--text-main);
      outline: none;
      font-size: 0.95rem;
    }

    .rename-modal input:focus {
      border-color: var(--accent);
    }

    .rename-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s;
    }

    .btn-secondary:hover {
      background: var(--bg-main);
    }

    .btn-primary {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <!-- Mobile Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay" aria-label="Close sidebar" onclick="closeAllOverlays()"></div>

  <!-- Sidebar Navigation Drawer -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="icon.png" alt="MindGuard-AI Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2965/2965358.png'">
      <h2>MindGuard-AI</h2>
    </div>
    <button class="new-chat-btn" onclick="createNewSession()" aria-label="Start new conversation">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      New Conversation
    </button>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <!-- Main Content Workspace -->
  <main class="main-container" id="main-app">
    <!-- Top Bar Navigation -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button class="icon-btn menu-btn" onclick="openSidebar()" aria-label="Open Conversations Menu">
          <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <div class="brand-title">
          <img src="icon.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2965/2965358.png'">
          <h1>MindGuard-AI</h1>
        </div>
      </div>

      <div class="top-bar-right">
        <!-- PWA Install Button Pill -->
        <button class="install-pill" id="installPill" onclick="installPWA()" aria-label="Install App">
          📥 Install App
        </button>

        <!-- New Chat Action -->
        <button class="icon-btn" onclick="createNewSession()" aria-label="New Chat">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Chat Area -->
    <section class="chat-box" id="chatBox" aria-live="polite"></section>

    <!-- Floating Action Input Box -->
    <footer class="input-container">
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="Share your mood or thoughts..." aria-label="Message Input" onkeydown="handleKeyDown(event)"></textarea>
        
        <!-- Web Speech Recognition Mic Button -->
        <button class="action-btn" id="micBtn" onclick="toggleSpeechRecognition()" aria-label="Voice Input">
          <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>

        <!-- Send Message Button -->
        <button class="action-btn send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send Message">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </footer>
  </main>

  <!-- Mobile Bottom Sheet Options -->
  <div class="bottom-sheet-overlay" id="bottomSheetOverlay" aria-label="Close menu" onclick="closeAllOverlays()"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="bottom-sheet-handle"></div>
    <button class="sheet-option" onclick="triggerRenameSession()">
      ✏️ Rename Conversation
    </button>
    <button class="sheet-option danger" onclick="triggerDeleteSession()">
      🗑️ Delete Conversation
    </button>
  </div>

  <!-- Custom Rename Modal -->
  <div class="rename-modal-overlay" id="renameModalOverlay" aria-hidden="true">
    <div class="rename-modal">
      <h3>Rename Conversation</h3>
      <input type="text" id="renameInput" placeholder="Enter conversation title..." aria-label="Conversation title input">
      <div class="rename-modal-actions">
        <button class="btn-secondary" onclick="closeRenameModal()">Cancel</button>
        <button class="btn-primary" onclick="saveSessionRename()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // System State Engine
    let state = {
      sessions: {},
      currentSessionId: null,
      selectedTargetSessionId: null
    };

    let speechRecognizer = null;
    let isListening = false;
    let deferredPrompt = null;
    let activeOverlayStack = [];

    const INITIAL_WELCOME = "Hello! I am MindGuard-AI. How are you feeling today? You can share your mood, stress levels, or daily sleep quality.";

    // --- 1. System Initialization & Theme Handler ---
    window.addEventListener('DOMContentLoaded', () => {
      loadStateFromStorage();
      setupSystemThemeEngine();
      registerPWA();
      setupSpeechRecognition();
      setupHistoryBackHandler();
      setupViewportLock(); // NEW: Keyboard mobile fix
      renderSidebar();
      renderCurrentChat();
    });

    // --- NEW: Viewport Mobile Lock (Keyboard Fixes) ---
    function setupViewportLock() {
      function lockViewportAndHeader() {
          const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
          document.body.style.height = vh + 'px';
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
      }
      if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', lockViewportAndHeader);
          window.visualViewport.addEventListener('scroll', lockViewportAndHeader);
      }
      window.addEventListener('resize', lockViewportAndHeader);
      
      const inputEl = document.getElementById('userInput');
      inputEl.addEventListener('focus', () => {
          setTimeout(lockViewportAndHeader, 10);
          setTimeout(lockViewportAndHeader, 300);
      });
      inputEl.addEventListener('blur', () => {
          setTimeout(lockViewportAndHeader, 100);
      });
    }

    // Automatic System Default Theme Syncing
    function setupSystemThemeEngine() {
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      
      const applySystemTheme = (e) => {
        const isDark = e.matches;
        document.body.classList.toggle('light-mode', !isDark);
        const metaTheme = document.getElementById('metaThemeColor');
        if (metaTheme) {
          metaTheme.setAttribute('content', isDark ? '#121212' : '#f4f4f5');
        }
      };

      // Initial Sync
      applySystemTheme(mediaQuery);

      // Listen for runtime System Theme Switch
      mediaQuery.addEventListener('change', applySystemTheme);
    }

    // --- 2. Mobile Hardware Back Button Support (History API Fixed) ---
    function setupHistoryBackHandler() {
      // Ensure base state exists so backing out of overlays doesn't exit the app
      window.history.replaceState({ root: true }, '');

      window.addEventListener('popstate', (e) => {
        if (activeOverlayStack.length > 0) {
          const topOverlay = activeOverlayStack.pop();
          closeOverlayUI(topOverlay);
        }
      });
    }

    function pushOverlayState(overlayName) {
      activeOverlayStack.push(overlayName);
      window.history.pushState({ overlay: overlayName }, '');
    }

    function closeAllOverlays() {
      const stackSize = activeOverlayStack.length;
      if (stackSize > 0) {
        // Go back safely in history to pop the virtual routes
        window.history.go(-stackSize);
        // Clear UI states synchronously
        activeOverlayStack.forEach(overlay => closeOverlayUI(overlay));
        activeOverlayStack = [];
      }
    }

    function closeOverlayUI(overlayName) {
      if (overlayName === 'sidebar') {
        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('sidebarOverlay').classList.remove('active');
      } else if (overlayName === 'bottomSheet') {
        document.getElementById('bottomSheet').classList.remove('active');
        document.getElementById('bottomSheetOverlay').classList.remove('active');
      } else if (overlayName === 'renameModal') {
        document.getElementById('renameModalOverlay').classList.remove('active');
      }
    }

    function openSidebar() {
      document.getElementById('sidebar').classList.add('active');
      document.getElementById('sidebarOverlay').classList.add('active');
      pushOverlayState('sidebar');
    }

    function openBottomSheet(sessionId, event) {
      event.stopPropagation();
      state.selectedTargetSessionId = sessionId;
      document.getElementById('bottomSheet').classList.add('active');
      document.getElementById('bottomSheetOverlay').classList.add('active');
      pushOverlayState('bottomSheet');
    }

    // --- 3. Speech Recognition Engine ---
    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('micBtn').style.display = 'none';
        return;
      }

      speechRecognizer = new SpeechRecognition();
      speechRecognizer.continuous = false;
      speechRecognizer.interimResults = false;
      speechRecognizer.lang = 'en-US';

      speechRecognizer.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
      };

      speechRecognizer.onend = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };

      speechRecognizer.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const inputEl = document.getElementById('userInput');
        inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + transcript;
        autoResizeInput(inputEl);
      };

      speechRecognizer.onerror = () => {
        isListening = false;
        document.getElementById('micBtn').classList.remove('listening');
      };
    }

    function toggleSpeechRecognition() {
      if (!speechRecognizer) return;
      if (isListening) {
        speechRecognizer.stop();
      } else {
        speechRecognizer.start();
      }
    }

    // --- 4. Multi-Session Management (LocalStorage) ---
    function loadStateFromStorage() {
      const savedSessions = localStorage.getItem('mg_sessions');
      const savedActiveId = localStorage.getItem('mg_active_id');

      if (savedSessions) {
        state.sessions = JSON.parse(savedSessions);
      }

      if (savedActiveId && state.sessions[savedActiveId]) {
        state.currentSessionId = savedActiveId;
      } else {
        createNewSession(false);
      }
    }

    function saveStateToStorage() {
      localStorage.setItem('mg_sessions', JSON.stringify(state.sessions));
      localStorage.setItem('mg_active_id', state.currentSessionId);
    }

    function createNewSession(shouldRender = true) {
      const newId = 'session_' + Date.now();
      state.sessions[newId] = {
        id: newId,
        title: 'New Conversation',
        history: [
          { role: 'model', parts: [{ text: INITIAL_WELCOME }] }
        ]
      };
      state.currentSessionId = newId;
      saveStateToStorage();

      if (shouldRender) {
        renderSidebar();
        renderCurrentChat();
        closeAllOverlays();
      }
    }

    function switchSession(id) {
      if (!state.sessions[id]) return;
      state.currentSessionId = id;
      saveStateToStorage();
      renderSidebar();
      renderCurrentChat();
      closeAllOverlays();
    }

    function triggerDeleteSession() {
      const id = state.selectedTargetSessionId;
      if (!id || !state.sessions[id]) return;

      delete state.sessions[id];
      const remainingIds = Object.keys(state.sessions);

      if (remainingIds.length === 0) {
        createNewSession(false);
      } else if (state.currentSessionId === id) {
        state.currentSessionId = remainingIds[remainingIds.length - 1];
      }

      saveStateToStorage();
      renderSidebar();
      renderCurrentChat();
      closeAllOverlays();
    }

    function triggerRenameSession() {
      const id = state.selectedTargetSessionId;
      if (!id || !state.sessions[id]) return;

      const currentTitle = state.sessions[id].title;
      const inputEl = document.getElementById('renameInput');
      inputEl.value = currentTitle;

      document.getElementById('renameModalOverlay').classList.add('active');
      pushOverlayState('renameModal');
      setTimeout(() => inputEl.focus(), 100);
    }

    function saveSessionRename() {
      const id = state.selectedTargetSessionId;
      const inputEl = document.getElementById('renameInput');
      const newTitle = inputEl.value.trim();

      if (id && state.sessions[id] && newTitle) {
        state.sessions[id].title = newTitle;
        saveStateToStorage();
        renderSidebar();
      }
      closeAllOverlays();
    }

    function closeRenameModal() {
      closeAllOverlays();
    }

    function renderSidebar() {
      const listEl = document.getElementById('sessionList');
      listEl.innerHTML = '';

      Object.values(state.sessions).reverse().forEach(session => {
        const item = document.createElement('div');
        item.classList.add('session-item');
        if (session.id === state.currentSessionId) item.classList.add('active');

        item.onclick = () => switchSession(session.id);
        item.innerHTML = `
          <span class="session-title">💬 ${escapeHTML(session.title)}</span>
          <button class="session-menu-trigger" aria-label="Session Options" onclick="openBottomSheet('${session.id}', event)">⋮</button>
        `;
        listEl.appendChild(item);
      });
    }

    function renderCurrentChat() {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      const activeSession = state.sessions[state.currentSessionId];
      if (!activeSession) return;

      activeSession.history.forEach(msg => {
        const type = msg.role === 'model' ? 'ai' : 'user';
        appendMessageUI(msg.parts[0].text, type);
      });
    }

    // --- 5. Messaging Engine & Backend Connectivity ---
    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';

      const activeSession = state.sessions[state.currentSessionId];
      
      // Auto-title conversation on first prompt
      if (activeSession.history.length <= 1) {
        activeSession.title = text.length > 22 ? text.substring(0, 22) + '...' : text;
        renderSidebar();
      }

      // Add User Message UI
      appendMessageUI(text, 'user');
      activeSession.history.push({ role: 'user', parts: [{ text }] });
      saveStateToStorage();

      // Show Gemini Thinking Loader
      const thinkingEl = showThinkingAnimation();

      try {
        const response = await fetch('https://project-9uo5.onrender.com/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: activeSession.history })
        });

        const data = await response.json();
        thinkingEl.remove();

        if (response.status === 429) {
          appendMessageUI(data.error || "Rate limit exceeded. Please wait a minute.", 'ai');
        } else if (data.text) {
          appendMessageUI(data.text, 'ai');
          activeSession.history.push({ role: 'model', parts: [{ text: data.text }] });
          saveStateToStorage();
        } else {
          appendMessageUI("Unable to process response at this time.", 'ai');
        }
      } catch (err) {
        thinkingEl.remove();
        appendMessageUI("Network error: Failed to connect to MindGuard engine.", 'ai');
      }
    }

    // --- NEW: Appending Message UI with Action Tools Structure ---
    function appendMessageUI(text, sender) {
      const chatBox = document.getElementById('chatBox');
      
      const wrapperDiv = document.createElement('div');
      wrapperDiv.classList.add('message-wrapper', sender);
      
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.innerText = text;
      
      // Add double tap to copy functionality globally 
      msgDiv.addEventListener('dblclick', () => {
         navigator.clipboard.writeText(text);
      });
      
      wrapperDiv.appendChild(msgDiv);
      
      // Inject Native Tools for AI responses
      if (sender === 'ai') {
        const actionsDiv = document.createElement('div');
        actionsDiv.classList.add('message-actions');
        actionsDiv.innerHTML = `
          <button class="msg-action-icon" aria-label="Copy message" onclick="copyMessageText(this)">
            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
          </button>
          <button class="msg-action-icon" aria-label="Speak message" onclick="speakMessageText(this)">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
        `;
        wrapperDiv.appendChild(actionsDiv);
      }
      
      chatBox.appendChild(wrapperDiv);
      
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
      
      return msgDiv;
    }
    
    // --- NEW: Copy & Speak Interactions ---
    window.copyMessageText = function(btn) {
       if(navigator.vibrate) navigator.vibrate(2);
       const wrapper = btn.closest('.message-wrapper');
       const text = wrapper.querySelector('.message').innerText;
       navigator.clipboard.writeText(text);
       btn.style.color = 'var(--accent)';
       setTimeout(() => btn.style.color = 'var(--text-sub)', 1500);
    };
    
    window.speakMessageText = function(btn) {
       if(navigator.vibrate) navigator.vibrate(2);
       const wrapper = btn.closest('.message-wrapper');
       const text = wrapper.querySelector('.message').innerText;
       
       if (window.speechSynthesis.speaking) {
           window.speechSynthesis.cancel();
       } else {
           const utterance = new SpeechSynthesisUtterance(text);
           window.speechSynthesis.speak(utterance);
       }
    };

    // --- UPDATED: Replicated Advanced Spinner Animation ---
    function showThinkingAnimation() {
      const chatBox = document.getElementById('chatBox');
      const container = document.createElement('div');
      container.classList.add('thinking-container');
      container.innerHTML = `
        <div class="thinking-logo-container">
            <div class="thinking-spinner"></div>
            <img src="icon.png" class="thinking-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2965/2965358.png'">
        </div>
        <div class="thinking-header">MindGuard-AI is reflecting...</div>
      `;
      chatBox.appendChild(container);
      
      requestAnimationFrame(() => {
        chatBox.scrollTop = chatBox.scrollHeight;
      });
      
      return container;
    }

    // --- 6. Utilities & Service Worker Registration ---
    function registerPWA() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log('Service Worker Active'))
          .catch(err => console.log('SW Registration Failed:', err));
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installPill = document.getElementById('installPill');
        if (installPill) installPill.style.display = 'flex';
      });
    }

    function installPWA() {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('installPill').style.display = 'none';
      });
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      } else {
        autoResizeInput(e.target);
      }
    }

    function autoResizeInput(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
